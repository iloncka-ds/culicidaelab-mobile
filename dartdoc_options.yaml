dartdoc:
  # Basic configuration for API documentation generation
  
  # Output configuration
  output: "docs/api-reference"
  
  # Documentation generation options
  showUndocumentedCategories: false
  validateLinks: false
  
  # Files and directories to exclude from documentation generation
  exclude:
    - "test/**"
    - "integration_test/**"
    - "build/**"
    - "android/**"
    - "ios/**"
    - ".dart_tool/**"
    - "docs/**"