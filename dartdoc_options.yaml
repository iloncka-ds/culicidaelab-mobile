dartdoc:

  # Documentation generation options
  showUndocumentedCategories: false
  validateLinks: false
  header:
    - 'docs/_config/templates/head.html'
  footer:
    - 'docs/_config/templates/footer.html'
  # Files and directories to exclude from documentation generation
  exclude:
    - "test/**"
    - "integration_test/**"
    - "build/**"
    - "android/**"
    - "ios/**"
    - ".dart_tool/**"
    - "docs/**"
    - README.md
