# GitHub Pages deployment workflow
# This workflow is specifically for GitHub Pages deployment
# and is separate from the main documentation workflow

name: Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'dartdoc_options.yaml'
      - '.github/workflows/pages.yml'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_VERSION: '3.16.0'
      PYTHON_VERSION: '3.11'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for git info

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Setup Pages
        uses: actions/configure-pages@v3

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install mkdocs-material
          pip install mkdocs-mermaid2-plugin
          pip install mkdocs-git-revision-date-localized-plugin
          pip install mkdocs-minify-plugin

      - name: Generate API documentation
        run: |
          echo "Generating Dart API documentation..."
          dart doc --output docs/api-reference --validate-links
          
          # Verify API docs were generated
          if [ ! -d "docs/api-reference" ] || [ -z "$(ls -A docs/api-reference)" ]; then
            echo "❌ API documentation generation failed"
            exit 1
          fi
          echo "✅ API documentation generated successfully"

      - name: Build with MkDocs
        run: |
          echo "Building documentation site with MkDocs..."
          mkdocs build --strict --verbose
          
          # Verify the site was built
          if [ ! -d "site" ] || [ ! -f "site/index.html" ]; then
            echo "❌ MkDocs site build failed"
            exit 1
          fi
          echo "✅ MkDocs site built successfully"

      - name: Add .nojekyll file
        run: |
          # Ensure GitHub Pages doesn't try to process with Jekyll
          touch site/.nojekyll
          echo "✅ Added .nojekyll file"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./site

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

      - name: Post-deployment verification
        run: |
          echo "🎉 Documentation deployed successfully!"
          echo "📍 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "🔍 Verifying deployment..."
          
          # Wait a moment for deployment to propagate
          sleep 10
          
          # Basic verification that the site is accessible
          if curl -f -s "${{ steps.deployment.outputs.page_url }}" > /dev/null; then
            echo "✅ Site is accessible"
          else
            echo "⚠️  Site may not be immediately accessible (this is normal)"
          fi