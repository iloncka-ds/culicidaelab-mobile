name: Documentation Build and Deploy

on:
  push:
    tags: [ 'docs v*' ]

  pull_request:
    tags: [ 'docs v*' ]

  workflow_dispatch:
    # Allow manual triggering of the workflow

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.29.3'
  PYTHON_VERSION: '3.11'

jobs:
  # Job 1: Build and validate documentation
  build-docs:
    name: Build Documentation
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Fetch full history for better git info

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        cache: true

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Flutter dependencies
      run: flutter pub get

    - name: Install Python dependencies
      run: |
        pip install --upgrade pip
        pip install mkdocs-material
        pip install mkdocs-mermaid2-plugin
        pip install mkdocs-git-revision-date-localized-plugin
        pip install mkdocs-minify-plugin
        pip install htmlproofer || echo "htmlproofer installation failed, continuing..."

    - name: Verify documentation configuration
      run: |
        echo "Checking dartdoc_options.yaml..."
        if [ -f "dartdoc_options.yaml" ]; then
          echo "✓ dartdoc_options.yaml found"
          cat dartdoc_options.yaml
        else
          echo "⚠ dartdoc_options.yaml not found, using defaults"
        fi

        echo "Checking mkdocs.yml..."
        if [ -f "mkdocs.yml" ]; then
          echo "✓ mkdocs.yml found"
          mkdocs --version
        else
          echo "❌ mkdocs.yml not found"
          exit 1
        fi

    - name: Generate API documentation
      run: |
        echo "Generating Dart API documentation..."
        dart doc --output docs/api-reference --validate-links

        # Check if API docs were generated successfully
        if [ -d "docs/api-reference" ] && [ "$(ls -A docs/api-reference)" ]; then
          echo "✓ API documentation generated successfully"
          echo "Generated files:"
          ls -la docs/api-reference/ | head -10
        else
          echo "❌ API documentation generation failed"
          exit 1
        fi

    - name: Build MkDocs site
      run: |
        echo "Building MkDocs documentation site..."
        mkdocs build --strict --verbose

        # Verify the site was built
        if [ -d "site" ] && [ -f "site/index.html" ]; then
          echo "✓ MkDocs site built successfully"
          echo "Site structure:"
          find site -name "*.html" | head -10
        else
          echo "❌ MkDocs site build failed"
          exit 1
        fi

    - name: Run comprehensive validation
      run: |
        echo "Running comprehensive documentation validation..."
        dart scripts/ci_validation.dart --verbose --output-format json

    - name: Upload validation reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: validation-reports
        path: |
          validation-report.json
          validation-junit.xml
        retention-days: 30

    - name: Setup Pages (for main branch only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/configure-pages@v3
      continue-on-error: true

    - name: Add .nojekyll file (for GitHub Pages)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: touch site/.nojekyll

    - name: Upload to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v4
      with:
        path: ./site

    - name: Upload documentation artifacts (for other branches/PRs)
      if: github.ref != 'refs/heads/main' || github.event_name != 'push'
      uses: actions/upload-artifact@v4
      with:
        name: documentation-site
        path: site/
        retention-days: 30

    - name: Upload API documentation artifacts
      uses: actions/upload-artifact@v4
      with:
        name: api-documentation
        path: docs/api-reference/
        retention-days: 30

  # Job 2: Quality assurance checks
  quality-checks:
    name: Quality Assurance
    needs: build-docs
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Download documentation artifacts
      uses: actions/download-artifact@v4
      with:
        name: documentation-site
        path: site/

    - name: Run accessibility checks
      run: |
        echo "Running basic accessibility checks..."
        # Check for alt text in images
        if grep -r "!\[.*\](" site/ | grep -v "!\[.*\](" | head -5; then
          echo "⚠️  Found images that may be missing alt text"
        else
          echo "✅ No obvious alt text issues found"
        fi

        # Check for proper heading structure
        echo "Checking heading structure..."
        find site/ -name "*.html" -exec grep -l "<h[1-6]" {} \; | head -5 | while read file; do
          echo "Checking headings in: $file"
        done

    - name: Performance analysis
      run: |
        echo "Analyzing site performance..."

        # Check total site size
        SITE_SIZE=$(du -sh site/ | cut -f1)
        echo "📊 Total site size: $SITE_SIZE"

        # Check for large files
        echo "🔍 Largest files:"
        find site/ -type f -exec ls -lh {} \; | sort -k5 -hr | head -10

        # Check for optimization opportunities
        echo "🔧 Optimization opportunities:"
        find site/ -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" | wc -l | xargs echo "Images found:"
        find site/ -name "*.js" | wc -l | xargs echo "JavaScript files:"
        find site/ -name "*.css" | wc -l | xargs echo "CSS files:"

  # Job 3: Validate external links (runs on schedule and manual trigger)
  validate-external-links:
    name: Validate External Links
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install requests beautifulsoup4 markdown



    - name: Create issue for broken links
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          const title = 'Broken external links found in documentation';
          const body = `
          The scheduled external link validation found broken links in the documentation.

          Please check the workflow logs for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          This issue was automatically created by the documentation validation workflow.
          `;

          // Check if an issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: ['documentation', 'broken-links']
          });

          if (issues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['documentation', 'broken-links', 'automated']
            });
          }

  # Job 4: Deploy to GitHub Pages (only on main branch pushes)
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Post-deployment verification
      run: |
        echo "🎉 Documentation deployed successfully!"
        echo "📍 Site URL: ${{ steps.deployment.outputs.page_url }}"
        echo "🔍 Verifying deployment..."

        # Wait a moment for deployment to propagate
        sleep 10

        # Basic verification that the site is accessible
        if curl -f -s "${{ steps.deployment.outputs.page_url }}" > /dev/null; then
          echo "✅ Site is accessible"
        else
          echo "⚠️  Site may not be immediately accessible (this is normal)"
        fi