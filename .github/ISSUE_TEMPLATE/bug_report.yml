name: Bug Report
description: File a bug report to help us improve
title: "[BUG] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us resolve the issue quickly.

  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug...
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe what you expected...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Describe what actually happened...
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: Please provide detailed steps to reproduce the issue
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often does this occur?
      options:
        - Always
        - Sometimes
        - Rarely
        - Only once
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: What device are you using?
      placeholder: e.g., iPhone 12, Samsung Galaxy S21
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating System
      description: What OS version are you running?
      placeholder: e.g., iOS 15.0, Android 12
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App Version
      description: What version of the app are you using?
      placeholder: e.g., 1.2.3
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this issue?
      options:
        - Critical - App crashes or major functionality broken
        - High - Important feature not working
        - Medium - Minor feature issue or inconvenience
        - Low - Cosmetic issue or minor improvement
    validations:
      required: true

  - type: checkboxes
    id: feature-area
    attributes:
      label: Feature Area
      description: Which area of the app is affected?
      options:
        - label: Mosquito Classification
        - label: Gallery/Species Information
        - label: Disease Information
        - label: Map/Location Features
        - label: User Interface
        - label: Performance
        - label: Localization
        - label: Settings/Preferences

  - type: textarea
    id: error-logs
    attributes:
      label: Error Messages/Logs
      description: If applicable, paste any error messages or relevant log output
      render: shell
      placeholder: Paste error messages here...

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context about the problem here, including screenshots if applicable
      placeholder: Any additional information that might help...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched for existing issues
          required: true
        - label: I have provided all required information
          required: true
        - label: I have tested on the latest version
          required: true