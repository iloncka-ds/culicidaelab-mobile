name: Feature Request
description: Suggest an idea for this project
title: "[FEATURE] "
labels: ["enhancement", "needs-discussion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please provide as much detail as possible to help us understand your request.

  - type: textarea
    id: feature-summary
    attributes:
      label: Feature Summary
      description: A clear and concise description of the feature you'd like to see implemented.
      placeholder: Describe the feature...
    validations:
      required: true

  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? What user need does it address?
      placeholder: Describe the problem this feature would solve...
    validations:
      required: true

  - type: textarea
    id: user-story
    attributes:
      label: User Story
      description: Describe this feature as a user story
      placeholder: |
        As a [type of user]
        I want [goal/desire]
        So that [benefit/value]
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your preferred solution or approach to implementing this feature.
      placeholder: Describe how you think this should work...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative solutions or features you've considered.
      placeholder: What other approaches did you consider?

  - type: dropdown
    id: user-impact
    attributes:
      label: User Impact
      description: How many users would benefit from this feature?
      options:
        - High - Addresses critical user need
        - Medium - Improves user experience significantly
        - Low - Nice to have enhancement
    validations:
      required: true

  - type: dropdown
    id: implementation-effort
    attributes:
      label: Implementation Effort (Estimate)
      description: How much work do you think this would require?
      options:
        - Small - Few hours of work
        - Medium - Few days of work
        - Large - Weeks of work
        - Extra Large - Months of work
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature?
      options:
        - Critical - Needed for next release
        - High - Important for upcoming release
        - Medium - Can wait for future release
        - Low - Long-term enhancement
    validations:
      required: true

  - type: checkboxes
    id: feature-category
    attributes:
      label: Feature Category
      description: Which area of the app would this feature affect?
      options:
        - label: Mosquito Classification
        - label: Species Gallery
        - label: Disease Information
        - label: Map/Location Features
        - label: User Experience
        - label: Performance
        - label: Accessibility
        - label: Localization
        - label: Data Management
        - label: Research Tools
        - label: Developer Tools

  - type: checkboxes
    id: target-users
    attributes:
      label: Target Users
      description: Who would primarily benefit from this feature?
      options:
        - label: General Public
        - label: Researchers/Scientists
        - label: Public Health Officials
        - label: Educators
        - label: Developers

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: What would need to be true for this feature to be considered complete?
      placeholder: |
        - [ ] Criteria 1
        - [ ] Criteria 2
        - [ ] Criteria 3

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or examples about the feature request here.
      placeholder: Any additional information, mockups, or references...

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched for existing feature requests
          required: true
        - label: I have clearly described the problem and solution
          required: true
        - label: I understand this is a request, not a guarantee
          required: true