site_name: CulicidaeLab Documentation

repo_url: https://github.com/iloncka-ds/culicidaelab-mobile
strict: false
validation:
  absolute_links: warn
  unrecognized_links: warn

theme:
  name: material
  # custom_dir: docs/api_docs
  font:
    text: Merriweather Sans
    code: Red Hat Mono

  palette:
    # Светлая тема
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night

    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - toc.integrate
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

  # Custom logo and favicon
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico

  # Font configuration
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'


# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.snippets



extra:
  alternate:
    - name: English
      link: https://iloncka-ds.github.io/culicidaelab-mobile/en
      lang: en
    - name: Русский
      link: https://iloncka-ds.github.io/culicidaelab-mobile/ru
      lang: ru

extra_css:
  - assets/css/custom.css

# Custom JavaScript
extra_javascript:
  - assets/js/custom.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js