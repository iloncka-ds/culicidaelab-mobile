site_name: CulicidaeLab Documentation
site_description: Comprehensive documentation for the CulicidaeLab Flutter mobile application
site_author: CulicidaeLab Team
site_url: https://culicidaelab.github.io/culicidaelab-mobile/

# Repository information
repo_name: culicidaelab/culicidaelab-mobile
repo_url: https://github.com/culicidaelab/culicidaelab-mobile
edit_uri: -/edit/main/docs/

# Copyright
copyright: Copyright &copy; 2024 CulicidaeLab Team

# Configuration
theme:
  name: material
  language: en
  
  # Color scheme
  palette:
    - scheme: default
      primary: teal
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  
  # Features
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - toc.integrate
    - toc.follow
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view

  # Custom logo and favicon (commented out until images are added)
  # logo: assets/images/logo.png
  # favicon: assets/images/favicon.ico

  # Font configuration
  font:
    text: Roboto
    code: Roboto Mono

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  
  - mermaid2:
      arguments:
        theme: |
          ^(JSON.parse(__md_get("__palette").index == 1)) ?
          'dark' : 'light'
  
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
      cache_safe: true

  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago

# Extensions
markdown_extensions:
  # Python Markdown
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page

  # Python Markdown Extensions
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:materialx.emoji.twemoji
      emoji_generator: !!python/name:materialx.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree navigation
nav:
  - Home: index.md
  
  - User Guide:
    - user-guide/index.md
    - Getting Started: user-guide/getting-started.md
    - Mosquito Identification: user-guide/mosquito-identification.md
    - Using Gallery: user-guide/using-gallery.md
    - Disease Information: user-guide/disease-information.md
    - Troubleshooting: user-guide/troubleshooting.md
    - FAQ: user-guide/faq.md
  
  - Developer Guide:
    - developer-guide/index.md
    - Architecture: developer-guide/architecture.md
    - Development Setup: developer-guide/setup-development.md
    - Project Structure: developer-guide/project-structure.md
    - Data Models: developer-guide/data-models.md
    - API Integration: developer-guide/api-integration.md
    - AI Model Integration: developer-guide/ai-model-integration.md
    - Ecosystem Integration: developer-guide/ecosystem-integration.md
    - State Management: developer-guide/state-management.md
    - Testing Guide: developer-guide/testing-guide.md
    - Performance Optimization: developer-guide/performance-optimization.md
    - Extending Functionality: developer-guide/extending-functionality.md
  
  - API Reference:
    - api-reference/index.md
  
  - Contribution:
    - contribution/index.md
    - Contributing: contribution/contributing.md
    - Code Style: contribution/code-style.md
    - Pull Request Process: contribution/pull-request-process.md
    - Development Workflow: contribution/development-workflow.md
  

# Extra configuration
extra:
  # Social links
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/culicidaelab/culicidaelab-mobile
    - icon: fontawesome/brands/github
      link: https://github.com/iloncka-ds/culicidaelab
    - icon: fontawesome/solid/paper-plane
      link: mailto:iloncka.ds@gmail.com
  # Version information
  version:
    provider: mike
    default: latest

  # Analytics (uncomment and configure if needed)
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX

# Custom CSS
extra_css:
  - assets/css/custom.css

# Custom JavaScript
extra_javascript:
  - assets/js/custom.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js